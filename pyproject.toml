[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "antigravity-mcp-fork"
dynamic = ["version"]
description = "Fork of antigravity-mcp adding GPT-planned native multi-parent orchestration, job supervision and signed job-event webhooks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Kio-pon" },
]
maintainers = [
    { name = "zwsxzy" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "antigravity",
    "gemini",
    "gpt",
    "agent",
    "subagent",
    "orchestration",
    "multi-parent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The bridge speaks MCP over stdio and talks to the language server with
# urllib, so it runs on a bare interpreter with nothing installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/zwsxzy/antigravity-mcp-fork"
Issues = "https://github.com/zwsxzy/antigravity-mcp-fork/issues"
Upstream = "https://github.com/Kio-pon/antigravity-mcp"

[project.scripts]
antigravity-mcp = "antigravity_mcp.server:main"

[tool.hatch.version]
path = "src/antigravity_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]